[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dispatch-mcp-server"
version = "0.1.0"
description = "MCP server exposing Google Workspace (Sheets + Drive) for Claude"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "asyncpg>=0.29",
    "google-api-python-client>=2.130.0",
    "google-auth>=2.30.0",
    "mangum>=0.17.0",
    "mcp>=1.0.0",
    "pydantic>=2.6.0",
    "pymupdf>=1.23.0",
    "rapidfuzz>=3.0",
    "python-dotenv>=1.0.1",
    "reportlab>=4.0.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12.0",
]

[project.scripts]
dispatch-mcp-server = "main:run"

[tool.setuptools.packages.find]
where = ["."]
include = ["shared*", "services*", "server*"]
exclude = ["tests*", "docs*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
